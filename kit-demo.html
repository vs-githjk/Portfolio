<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>World kit demo: the dragon alone</title>
    <style>
      /* Dev only: the dragon on a plain ground (src/world/demo.js lists the switches). */
      :root {
        --demo-ground: #0d0f14;
        --demo-ink: #d8dde6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--demo-ground);
        color: var(--demo-ink);
        font: 13px/1.5 ui-monospace, Menlo, monospace;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      p {
        position: fixed;
        left: 16px;
        bottom: 12px;
        margin: 0;
        opacity: 0.7;
      }
      html[data-bare] p {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <p id="label"></p>
    <script type="module" src="/src/world/demo.js"></script>
  </body>
</html>
